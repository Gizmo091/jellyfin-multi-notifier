version: '3.8'

services:
  jellyfin-multi-notifier:
    image: ghcr.io/gizmo091/jellyfin-multi-notifier:latest
    # Pour build local (développement), commenter "image" ci-dessus et décommenter:
    # build: .
    container_name: jellyfin-multi-notifier
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - JELLYFIN_URL=${JELLYFIN_URL:-http://jellyfin:8096}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - WHATSAPP_PHONE_NUMBER=${WHATSAPP_PHONE_NUMBER}
      - WHATSAPP_LOGIN_ON_STARTUP=${WHATSAPP_LOGIN_ON_STARTUP:-true}
      - AGGREGATION_WINDOW_MINUTES=${AGGREGATION_WINDOW_MINUTES:-15}
      - AGGREGATION_WINDOW_MOVIES_MINUTES=${AGGREGATION_WINDOW_MOVIES_MINUTES}
      - AGGREGATION_WINDOW_SERIES_MINUTES=${AGGREGATION_WINDOW_SERIES_MINUTES}
      - AGGREGATION_WINDOW_MOVIES_REMOVED_MINUTES=${AGGREGATION_WINDOW_MOVIES_REMOVED_MINUTES}
      - AGGREGATION_WINDOW_SERIES_REMOVED_MINUTES=${AGGREGATION_WINDOW_SERIES_REMOVED_MINUTES}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
